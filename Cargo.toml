[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
discord-data-cli-core = { path = "crates/core" }
anyhow = "1.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
walkdir = "2.5"
toml = "1.0.3"
ureq = "3.2.0"
sha2 = "0.10"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
